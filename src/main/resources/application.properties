quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
flyway.validateMigrationNaming=true
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL}
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.datasource.devservices.enabled=false
%dev.quarkus.flyway.clean-at-start=true
# JWT
smallrye.jwt.sign.key=${JWT_PRIVATE_KEY}
mp.jwt.verify.publickey=${JWT_PUBLIC_KEY}
mp.jwt.verify.issuer=wabrain
%dev.quarkus.log.category."io.quarkus.smallrye.jwt.runtime.auth.MpJwtValidator".level=TRACE
%dev.quarkus.log.category."io.quarkus.smallrye.jwt.runtime.auth.MpJwtValidator".min-level=TRACE
# log dev
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.hibernate-orm.log.bind-parameters=true
